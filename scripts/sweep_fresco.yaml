program: scripts/train.sh
method: grid
metric:
  name: eval/loss
  goal: minimize
parameters:
  pipeline.n_stages:
    values: [2, 4, 8, 16, 32]
  method.name:
    value: fresco
  method.proj_rank_ratio:
    # k / 384 for k = 12, 24, 48, 64, 96, 154, 269, 384.
    values: [0.03125, 0.0625, 0.125, 0.16666666666666666, 0.25, 0.4010416666666667, 0.7005208333333334, 1.0]
  lr.schedule.peak_value:
    values: [1.0e-4, 3.0e-4, 1.0e-3]
  optimizer.momentum:
    values: [0.9, 0.99]
  damper.staleness_lr_steps:
    values: [0, 15000]
command:
  - bash
  - ${program}
  - --logging.wandb
  - --logging.wandb_project=fresco
  - ${args}
