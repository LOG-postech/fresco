program: scripts/train.sh
method: grid
metric:
  name: train/loss_ema
  goal: minimize
parameters:
  pipeline.n_stages:
    values: [2, 4, 8, 16, 32]
  method.name:
    values: [stashing, pipeoptim_nostash, spectrain, lwp, inconsistent]
  lr.schedule.peak_value:
    values: [1.0e-4, 3.0e-4, 1.0e-3]
  optimizer.momentum:
    values: [0.9, 0.99]
  damper.staleness_lr_steps:
    values: [0, 15000]
command:
  - bash
  - ${program}
  - --logging.wandb
  - --logging.wandb_project=fresco
  - ${args}
